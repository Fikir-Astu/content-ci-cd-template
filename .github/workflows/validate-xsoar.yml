name: XSOAR Playbook Validation

on:
  push:
    branches:
      - dac-ci-cd-exercise
    paths:
      - "Packs/**"
      - ".github/workflows/validate-xsoar.yml"
  pull_request:
    branches:
      - dac-ci-cd-exercise
    paths:
      - "Packs/**"
      - ".github/workflows/validate-xsoar.yml"

jobs:
  validate-xsoar:
    name: Validate XSOAR Content
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install demisto-sdk
        run: python -m pip install demisto-sdk

      - name: Validate content pack
        run: demisto-sdk validate -i Packs/LinuxPasswordChange
